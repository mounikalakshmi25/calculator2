<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scientific Calculator</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #222;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .calculator {
        background: #333;
        padding: 20px;
        border-radius: 10px;
        width: 320px;
    }
    input {
        width: 100%;
        height: 60px;
        font-size: 28px;
        text-align: right;
        margin-bottom: 15px;
        padding: 10px;
        border: none;
        border-radius: 5px;
    }
    button {
        width: 23%;
        height: 50px;
        margin: 1%;
        font-size: 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    .op { background: #ff9500; }
    .fn { background: #555; }
    .num { background: #666; }
</style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled>

    <!-- Row 1 -->
    <button class="fn" onclick="scientific('sin')">sin</button>
    <button class="fn" onclick="scientific('cos')">cos</button>
    <button class="fn" onclick="scientific('tan')">tan</button>
    <button class="op" onclick="clearDisplay()">C</button>

    <!-- Row 2 -->
    <button class="fn" onclick="scientific('sqrt')">√</button>
    <button class="fn" onclick="scientific('log')">log</button>
    <button class="fn" onclick="scientific('pow')">x²</button>
    <button class="op" onclick="append('/')">/</button>

    <!-- Row 3 -->
    <button class="num" onclick="append('7')">7</button>
    <button class="num" onclick="append('8')">8</button>
    <button class="num" onclick="append('9')">9</button>
    <button class="op" onclick="append('*')">*</button>

    <!-- Row 4 -->
    <button class="num" onclick="append('4')">4</button>
    <button class="num" onclick="append('5')">5</button>
    <button class="num" onclick="append('6')">6</button>
    <button class="op" onclick="append('-')">-</button>

    <!-- Row 5 -->
    <button class="num" onclick="append('1')">1</button>
    <button class="num" onclick="append('2')">2</button>
    <button class="num" onclick="append('3')">3</button>
    <button class="op" onclick="append('+')">+</button>

    <!-- Row 6 -->
    <button class="num" onclick="append('0')">0</button>
    <button class="num" onclick="append('.')">.</button>
    <button class="op" onclick="calculate()">=</button>
</div>

<script>
    function append(val) {
        document.getElementById("display").value += val;
    }

    function clearDisplay() {
        document.getElementById("display").value = "";
    }

    function calculate() {
        try {
            document.getElementById("display").value =
                eval(document.getElementById("display").value);
        } catch (e) {
            document.getElementById("display").value = "Error";
        }
    }

    function scientific(func) {
        let value = parseFloat(document.getElementById("display").value);

        if (isNaN(value)) return;

        switch (func) {
            case "sin": value = Math.sin(value); break;
            case "cos": value = Math.cos(value); break;
            case "tan": value = Math.tan(value); break;
            case "sqrt": value = Math.sqrt(value); break;
            case "log": value = Math.log10(value); break;
            case "pow": value = Math.pow(value, 2); break;
        }

        document.getElementById("display").value = value;
    }
</script>

</body>
</html>
